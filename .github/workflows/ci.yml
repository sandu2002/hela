name: HELA Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hela-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

  backend-security-tests:
    name: Backend Syntax & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hela-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: hela-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run syntax & security authorization tests
        run: npm test
